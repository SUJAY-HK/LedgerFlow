spring.application.name=ledgerflow
spring.datasource.url=jdbc:postgresql://localhost:5433/mydb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# JWT_SECRET is deployment-provided and must be at least 32 bytes; never commit a real value.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT15M}
app.jwt.issuer=${JWT_ISSUER:ledgerflow}
