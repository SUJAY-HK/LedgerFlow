spring.datasource.url=jdbc:h2:mem:ledgerflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only value. Production configuration always obtains its secret from JWT_SECRET.
app.jwt.secret=test-only-secret-that-is-at-least-thirty-two-bytes-long
app.jwt.expiration=PT15M
app.jwt.issuer=ledgerflow-test
